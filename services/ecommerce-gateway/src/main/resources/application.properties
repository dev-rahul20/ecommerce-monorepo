spring.application.name=ecommerce-gateway
server.port=8080

# Config Server
spring.config.import=optional:configserver:http://localhost:8888

# JWT: the signing key comes from the JWT_SECRET environment variable.
# Everything routed through the gateway needs a bearer token except these.
ecommerce.security.public-paths=POST /auth/api/login,POST /auth/api/refresh,POST /auth/api/logout,POST /user/api
