# Routes for the other services. Every route needs a JWT except the public paths
# set in the gateway (login, refresh, logout, POST /user/api to register).
spring.cloud.gateway.routes[8].id=auth
spring.cloud.gateway.routes[8].uri=lb://auth-service
spring.cloud.gateway.routes[8].predicates[0]=Path=/auth/api,/auth/api/**
spring.cloud.gateway.routes[8].filters[0]=RewritePath=/auth/api(?<segment>/?.*), /auth${segment}

